<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Heritage Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bronce: #C5A17A; --lona: #F9F4F0; --madera: #2A1F19; --negro: #111111; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--madera); background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png'); color: var(--lona); background-attachment: fixed; padding-top: 80px; }
        .site-header { background: rgba(26, 20, 17, 0.98); padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--negro); position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .site-header h1 { font-weight: 800; font-size: 1.8rem; margin: 0; letter-spacing: 3px; cursor: pointer; }
        .nav-menu ul { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { color: var(--lona); text-decoration: none; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; cursor: pointer; }
        .nav-menu a.active { opacity: 1; color: var(--bronce); border-bottom: 1px solid var(--bronce); }
        .content-section { display: none; animation: fadeIn 0.5s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hero { padding: 8rem 1rem 4rem; text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1596726192131-030a9e2d3122?q=80&w=1600'); background-size: cover; background-position: center; margin-bottom: 2rem; }
        .main-container { max-width: 1100px; margin: 2rem auto; padding: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 2rem; }
        .card { background: rgba(17, 17, 17, 0.7); border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 260px; object-fit: cover; filter: grayscale(20%); }
        .card-info { padding: 1.2rem; text-align: center; }
        .btn-adquirir { background: transparent; color: var(--lona); padding: 0.8rem; border: 1px solid var(--lona); font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px; width: 100%; }
        .btn-adquirir:hover { background: var(--bronce); color: #000; border-color: var(--bronce); }
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #111; border: 2px solid var(--bronce); padding: 3rem; width: 90%; max-width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #222; border: 1px solid #444; color: #fff; font-family: 'Montserrat'; }
        footer { text-align: center; padding: 4rem 1rem; opacity: 0.4; font-size: 0.8rem; }
        .historia-seccion { max-width: 1000px; margin: 2rem auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        .bitacora-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1000px; margin: 3rem auto; padding: 0 1.5rem; }
        .historia-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; }
        .historia-card img { width: 100%; height: 200px; object-fit: cover; filter: grayscale(60%); margin-bottom: 1rem; border-bottom: 1px solid var(--bronce); }
    </style>
</head>
<body>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul>
            <li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
            <li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
        </ul>
    </nav>
</header>

<section id="suministros" class="content-section active">
    <div class="hero"><h2>The Originals</h2><p>Equipo recuperado para la vida ruda</p></div>
    <div class="main-container"><div class="grid" id="galeria"></div></div>
</section>

<section id="bitacora" class="content-section">
    <div style="padding: 6rem 1rem 2rem; text-align: center;"><h2 style="text-transform: uppercase; letter-spacing: 4px;">Crónicas de Resistencia</h2></div>
    <div class="historia-seccion">
        <img src="https://images.unsplash.com/photo-1520639889413-5d5586a98235?q=80&w=800" style="width: 100%; height: 400px; object-fit: cover;">
        <div style="padding: 3rem;"><h3 style="color: var(--bronce); text-transform: uppercase;">Manifiesto</h3><p>Suministros que cuentan historias de labor y libertad.</p></div>
    </div>
    <div class="bitacora-grid">
        <div class="historia-card"><img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246?q=80&w=400"><h3>Denim Selvedge</h3><p>La orilla que nunca se deshilacha.</p></div>
    </div>
</section>

<div id="modal">
    <div class="modal-content">
        <h3 id="modal-titulo" style="color: var(--bronce); text-transform: uppercase;">ORDENAR</h3>
        <form id="form-pedido">
            <input type="text" id="nombre-cliente" placeholder="TU NOMBRE COMPLETO" required>
            <button type="submit" class="btn-adquirir" style="background: var(--bronce); color: #000;">ENVIAR A WHATSAPP</button>
            <button type="button" onclick="cerrarModal()" style="color:#555; margin-top:15px; cursor:pointer; background:none; border:none;">[ CANCELAR ]</button>
        </form>
    </div>
</div>

<footer>© 2026 MADLAMB. | SAN JOSÉ, CR</footer>

<script>
    // Memoria Global
    let prendaSeleccionadaParaEnvio = "";

    function showSection(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        window.scrollTo(0,0);
    }

    const prendas = [
        { id: 1, nombre: "HOODIE UNDER ARMOUR "REAL TREE"", precio: "35,000", foto: "Hoodie under armour real tree.jpg" },
        { id: 2, nombre: "CARHARRT DETROIT 100 AÑOS", precio: "50,000", foto: "Carharrt Detroit 100 años.jpg" },
        { id: 3, nombre: "WINDBREAKER PLAYBOY", precio: "25,000", foto: "Windbreaker PlayBoy.jpg" },
        { id: 4, nombre: "T-SHIRT GALLERY DEPT. "TOKYO" EDITION", precio: "35,000", foto: "Gallery dept. tokyo edition.jpg" },
        { id: 5, nombre: "ONEITA "LOSER" TEE", precio: "50,000", foto: "Oneita loser tee.jpg" }
    ];

    function cargar() {
        const galeria = document.getElementById('galeria');
        galeria.innerHTML = prendas.map(p => `
            <div class="card">
                <img src="${p.foto}">
                <div class="card-info">
                    <h3>${p.nombre}</h3>
                    <p class="precio">₡${p.precio}</p>
                    <button class="btn-adquirir" onclick="abrirModal('${p.nombre}')">ADQUIRIR</button>
                </div>
            </div>`).join('');
    }

    window.abrirModal = function(nombre) {
        prendaSeleccionadaParaEnvio = nombre; // Guarda el nombre inmediatamente
        document.getElementById('modal-titulo').innerText = "ORDENAR: " + nombre;
        document.getElementById('modal').style.display = 'flex';
    };

    window.cerrarModal = function() {
        document.getElementById('modal').style.display = 'none';
    };

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        e.preventDefault();
        const cliente = document.getElementById('nombre-cliente').value;
        const telefono = "50683087480";
        
        // El mensaje ahora usa la variable global que se llenó al abrir el modal
        const texto = `¡Saludos Madlamb.! Soy ${cliente}. Me interesa comprar: ${prendaSeleccionadaParaEnvio}.`;
        
        const url = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(texto);
        window.open(url, '_blank');
        cerrarModal();
    });

    cargar();
</script>
</body>
</html>
