<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADLAMB. | Archive Supply</title>

<meta name="description" content="MADLAMB Archive Supply — Curated vintage garments">
<link rel="icon" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="preloader">
<h2>MADLAMB.</h2>
</div>

<header class="site-header">

<h1 onclick="showSection('suministros')">MADLAMB.</h1>

<nav class="nav-menu">

<ul>
<li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
<li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
</ul>

</nav>

</header>


<section id="suministros" class="content-section active">

<div class="hero">

<h2>Archivo<br>Madlamb</h2>

<p><i>Historia & Legado</i></p>

<span class="hero-sub">
Curaduría de piezas vintage seleccionadas una a una.
</span>

</div>


<div class="filter-bar">

<button class="filter-btn active" onclick="filtrar('todas')">Todas</button>
<button class="filter-btn" onclick="filtrar('chaquetas')">Chaquetas</button>
<button class="filter-btn" onclick="filtrar('hoodies')">Hoodies</button>
<button class="filter-btn" onclick="filtrar('camisetas')">Camisetas</button>

</div>


<div class="main-container">

<div class="grid" id="galeria"></div>

</div>

</section>



<section id="bitacora" class="content-section">

<div class="bitacora-header">

<h2>EL LEGADO.</h2>

</div>

<div class="bitacora-grid" id="bitacora-grid"></div>

</section>


<footer>

<p>MADLAMB ARCHIVE SUPPLY</p>

<p class="footer-small">
Curated Vintage Garments — San José, Costa Rica
</p>

<p class="footer-small">
Established 2026
</p>

</footer>



<div id="modal" class="modal">

<div class="modal-content">

<h3>Adquirir</h3>

<form id="form-pedido">

<input type="text" id="nombre-cliente" placeholder="TU NOMBRE" required>

<button class="btn-adquirir">CONTINUAR A WHATSAPP</button>

<button type="button" onclick="cerrarModal()" class="cancel-btn">
Cancelar
</button>

</form>

</div>

</div>



<div id="modal-lectura" class="modal">

<div class="modal-content lectura">

<h3 id="lectura-titulo"></h3>

<p id="lectura-texto"></p>

<button onclick="cerrarLectura()" class="btn-adquirir">
Cerrar Lectura
</button>

</div>

</div>



<script src="data.js"></script>
<script src="main.js"></script>

</body>
</html>
