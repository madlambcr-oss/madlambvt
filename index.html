<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Biker Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --ambar: #ff8c00; /* Color gasolina/neón */
            --cuero: #0a0a0a;
            --acero-oxidado: #1c1c1c;
            --lona: #d4d4d4; 
        }

        body { 
            margin: 0; 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--cuero); 
            background-image: url('https://www.transparenttextures.com/patterns/black-leather.png'); 
            color: var(--lona); 
            padding-top: 80px;
        }

        /* --- HEADER TIPO BAR --- */
        .site-header { 
            background: rgba(0, 0, 0, 0.95); 
            padding: 1.2rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--ambar);
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.2);
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
        }

        .site-header h1 { 
            font-family: 'Oswald', sans-serif;
            font-weight: 700; font-size: 2rem; letter-spacing: 4px; margin: 0; 
            color: #fff; text-shadow: 2px 2px 0px var(--ambar);
        }

        .nav-menu ul { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { 
            color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; transition: 0.3s;
        }
        .nav-menu a.active { opacity: 1; color: var(--ambar); }

        /* --- SECCIONES --- */
        .content-section { display: none; animation: fadeIn 0.5s ease-in; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- HERO --- */
        .hero { 
            padding: 5rem 1rem; text-align: center; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1558981403-c5f91cbba527?q=80&w=1600');
            background-size: cover; background-position: center;
            border-bottom: 1px solid #333;
        }
        .hero h2 { font-family: 'Oswald', sans-serif; font-size: 4.5rem; letter-spacing: 10px; margin: 0; color: #fff; }
        .hero p { color: var(--ambar); font-weight: 700; letter-spacing: 5px; text-transform: uppercase; }

        /* --- GRID DE SUMINISTROS --- */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; }

        .card { 
            background: #111; 
            border: 1px solid #222;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--ambar); box-shadow: 0 0 15px rgba(255, 140, 0, 0.1); }

        /* --- CARRUSEL --- */
        .carousel-container { position: relative; width: 100%; height: 400px; overflow: hidden; }
        .carousel-track { display: flex; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); height: 100%; }
        .carousel-track img { min-width: 100%; object-fit: cover; }

        .nav-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0,0,0,0.8); color: var(--ambar); border: 1px solid var(--ambar); 
            width: 35px; height: 50px; cursor: pointer; z-index: 10; font-size: 1.2rem;
            transition: 0.3s;
        }
        .nav-btn:hover { background: var(--ambar); color: #000; }
        .prev-btn { left: 5px; }
        .next-btn { right: 5px; }

        /* --- INFO --- */
        .card-info { padding: 1.5rem; text-align: left; background: linear-gradient(to bottom, #111, #000); }
        .card-info h3 { font-family: 'Oswald', sans-serif; font-size: 1.1rem; letter-spacing: 1px; margin: 0; color: #fff; }
        .precio { font-size: 1.3rem; color: var(--ambar); margin: 10px 0; font-weight: 700; }

        .btn-adquirir { 
            background: #222; color: #fff; padding: 1rem; 
            border: 1px solid #444; font-weight: 700; text-transform: uppercase; 
            cursor: pointer; letter-spacing: 2px; width: 100%; transition: 0.3s;
        }
        .btn-adquirir:hover { background: var(--ambar); color: #000; border-color: var(--ambar); }

        /* --- MODAL --- */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #000; border: 2px solid var(--ambar); padding: 3rem; width: 90%; max-width: 380px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #111; border: 1px solid #333; color: #fff; font-family: inherit; font-size: 1rem; }

        footer { text-align: center; padding: 4rem; opacity: 0.4; font-size: 0.7rem; letter-spacing: 3px; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul>
            <li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
            <li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
        </ul>
    </nav>
</header>

<section id="suministros" class="content-section active">
    <div class="hero"><h2>ROUGH STOCK</h2><p>SUMINISTROS DE CARRETERA</p></div>
    <div class="main-container"><div class="grid" id="galeria"></div></div>
</section>

<section id="bitacora" class="content-section">
    <div style="padding: 8rem 1rem 4rem; text-align: center;">
        <h2 style="font-family: 'Oswald', sans-serif; font-size: 3rem; letter-spacing: 15px; margin: 0;">CRÓNICAS</h2>
    </div>
    <div class="main-container" style="text-align: center; color: #666; font-size: 0.9rem; letter-spacing: 2px;">
        <p>RECOLECTANDO HISTORIAS DE RESISTENCIA...</p>
    </div>
</section>

<div id="modal">
    <div class="modal-content">
        <h3 id="modal-titulo" style="font-family: 'Oswald'; color: var(--ambar); font-size: 1.5rem;">ORDENAR</h3>
        <form id="form-pedido">
            <input type="text" id="nombre-cliente" placeholder="TU NOMBRE" required>
            <button type="submit" class="btn-adquirir">PEDIR POR WHATSAPP</button>
            <button type="button" onclick="cerrarModal()" style="color:#444; margin-top:15px; cursor:pointer; background:none; border:none; font-size: 0.7rem;">[ CANCELAR ]</button>
        </form>
    </div>
</div>

<footer>© 2026 MADLAMB. | TRADICIÓN Y HERENCIA | SAN JOSÉ, CR</footer>

<script>
    let prendaSeleccionadaParaEnvio = "";
    const carruselPositions = {};

    function showSection(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        window.scrollTo(0,0);
    }

    // --- LISTA DE PRENDAS ACTUALIZADA ---
    const prendas = [
        { id: 1, nombre: "HOODIE UNDER ARMOUR 'REAL TREE'", precio: "35,000", fotos: ["Hoodie under armour real tree.jpg"] },
        { id: 2, nombre: "CARHARRT DETROIT 100 AÑOS", precio: "50,000", fotos: ["Carharrt Detroit 100 años.jpg"] },
        { id: 3, nombre: "WINDBREAKER PLAYBOY", precio: "25,000", fotos: ["Windbreaker PlayBoy.jpg","Windbreaker PlayBoy2.jpg","Windbreaker PlayBoy3.jpg"] },
        { id: 4, nombre: "T-SHIRT GALLERY DEPT. 'TOKYO' EDITION", precio: "35,000", fotos: ["Gallery dept. tokyo edition.jpg","Gallery dept. tokyo edition2.jpg"] },
        { id: 5, nombre: "ONEITA 'LOSER' TEE", precio: "50,000", fotos: ["Oneita loser tee.jpg","Oneita loser tee2.jpg"] }
    ];

    function cargar() {
        const galeria = document.getElementById('galeria');
        galeria.innerHTML = prendas.map((p, pIndex) => {
            const fotosHTML = p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join('');
            const botonesNav = p.fotos.length > 1 ? `
                <button class="nav-btn prev-btn" onclick="moveCarousel(${pIndex}, -1)">&#10094;</button>
                <button class="nav-btn next-btn" onclick="moveCarousel(${pIndex}, 1)">&#10095;</button>
            ` : '';

            return `
            <div class="card">
                <div class="carousel-container">
                    <div class="carousel-track" id="track-${pIndex}">
                        ${fotosHTML}
                    </div>
                    ${botonesNav}
                </div>
                <div class="card-info">
                    <h3>${p.nombre}</h3>
                    <p class="precio">₡${p.precio}</p>
                    <button class="btn-adquirir" onclick="abrirModal('${p.nombre}')">ADQUIRIR</button>
                </div>
            </div>`;
        }).join('');
    }

    window.moveCarousel = function(pIndex, direction) {
        const track = document.getElementById(`track-${pIndex}`);
        const totalFotos = prendas[pIndex].fotos.length;
        if (!carruselPositions[pIndex]) carruselPositions[pIndex] = 0;
        
        carruselPositions[pIndex] += direction;

        if (carruselPositions[pIndex] < 0) carruselPositions[pIndex] = totalFotos - 1;
        if (carruselPositions[pIndex] >= totalFotos) carruselPositions[pIndex] = 0;

        track.style.transform = `translateX(-${carruselPositions[pIndex] * 100}%)`;
    };

    window.abrirModal = function(nombre) {
        prendaSeleccionadaParaEnvio = nombre;
        document.getElementById('modal-titulo').innerText = nombre;
        document.getElementById('modal').style.display = 'flex';
    };

    window.cerrarModal = function() { document.getElementById('modal').style.display = 'none'; };

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        e.preventDefault();
        const cliente = document.getElementById('nombre-cliente').value;
        const msg = `¡Saludos Madlamb.! Soy ${cliente}. Me interesa comprar: ${prendaSeleccionadaParaEnvio}.`;
        window.open("https://wa.me/50683087480?text=" + encodeURIComponent(msg), '_blank');
        cerrarModal();
    });

    cargar();
</script>
</body>
</html>
