<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Archive Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;900&family=Playfair+Display:italic,wght@400;700&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505;
            --surface: #0d0d0d;
            --accent: #ffffff;
            --text-secondary: #707070;
            --border: rgba(255, 255, 255, 0.1);
            --transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            --oxido: #b35a38; 
        }

        /* --- Estética de Archivo (Background Grid) --- */
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg); color: var(--accent);
            padding-top: 80px; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            /* Líneas finas de fondo */
            background-image: linear-gradient(var(--border) 1px, transparent 1px),
                              linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        /* --- Header Minimalista --- */
        .site-header { 
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(20px);
            padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid var(--border);
        }
        .site-header h1 { font-weight: 900; font-size: 1.2rem; letter-spacing: 4px; margin: 0; cursor: pointer; }

        /* --- Hero Section: Más Editorial --- */
        .hero-banner { 
            height: 90vh; width: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('banner-vintage.png');
            background-size: cover; background-position: center; background-attachment: fixed;
            margin-bottom: 0;
        }
        .hero-banner h2 { 
            font-size: clamp(3rem, 12vw, 10rem); font-weight: 900; letter-spacing: -0.04em;
        }
        .hero-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; opacity: 0.5; margin-top: 20px; letter-spacing: 2px; }

        /* --- Filtros Estilo Catálogo --- */
        .filter-bar { 
            padding: 4rem 5%; display: flex; justify-content: flex-start; gap: 2rem; 
            border-bottom: 1px solid var(--border); background: var(--bg);
        }
        .filter-btn { 
            background: none; border: none; color: var(--accent); font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem; text-transform: uppercase; cursor: pointer; opacity: 0.4; transition: var(--transition);
        }
        .filter-btn.active { opacity: 1; color: var(--oxido); }

        /* --- Grid de Productos: Imagen Dominante (70%) --- */
        .main-container { max-width: 1800px; margin: 0 auto; padding: 0; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background-color: var(--border); }
        
        .card { 
            background: var(--bg); position: relative; padding: 60px; 
            display: flex; flex-direction: column; transition: var(--transition);
        }

        .carousel-container { 
            position: relative; width: 100%; aspect-ratio: 4/5; overflow: hidden; 
            margin-bottom: 40px; cursor: crosshair;
        }
        .carousel-track img { 
            min-width: 100%; object-fit: cover; transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        /* Hover microanimación */
        .card:hover .carousel-track img { transform: scale(1.08); }

        /* --- Info de Archivo --- */
        .card-info { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-info h3 { 
            font-size: 1.1rem; font-weight: 600; text-transform: uppercase; 
            margin: 0; max-width: 70%; line-height: 1.2;
        }
        .specs { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-secondary); margin-top: 10px; }
        
        .price-tag { font-family: 'JetBrains Mono', monospace; font-size: 1rem; color: var(--oxido); }

        .btn-adquirir { 
            margin-top: 30px; background: transparent; color: #fff; border: 1px solid var(--border);
            padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
            letter-spacing: 2px; transition: var(--transition); cursor: pointer;
        }
        .btn-adquirir:hover { background: #fff; color: #000; }

        /* --- Bitácora: Formato Editorial --- */
        .bitacora-grid { display: grid; grid-template-columns: 1fr; max-width: 1000px; margin: 0 auto; }
        .bitacora-item { 
            padding: 100px 0; border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }
        .meta-bitacora { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; opacity: 0.5; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .card { padding: 30px; }
        }
    </style>
</head>
<body>

<div id="preloader"><h2>MADLAMB.</h2></div>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul style="list-style: none; display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;">
            <li><a id="nav-suministros" onclick="showSection('suministros')">[ 01. ARCHIVE ]</a></li>
            <li><a id="nav-bitacora" onclick="showSection('bitacora')">[ 02. JOURNAL ]</a></li>
        </ul>
    </nav>
</header>

<section id="suministros" class="content-section active">
    <div class="hero-banner">
        <h2>OBJECTS</h2>
        <div class="hero-meta">EST. 2026 — CURATED SELECTION</div>
    </div>
    
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrar('todas')">ALL ITEMS</button>
        <button class="filter-btn" onclick="filtrar('jackets')">OUTERWEAR</button>
        <button class="filter-btn" onclick="filtrar('hoodies')">HOODIES</button>
        <button class="filter-btn" onclick="filtrar('camisetas')">COTTON T-SHIRTS</button>
    </div>
    
    <div class="main-container">
        <div class="grid" id="galeria"></div>
    </div>
</section>

<script>
    // Se mantiene tu lógica de JS actual, pero ajustamos la función cargar() 
    // para reflejar la nueva estructura de "Archivo".

    function cargar(filtro = 'todas') {
        const galeria = document.getElementById('galeria');
        const filtradas = filtro === 'todas' ? prendas : prendas.filter(p => p.categoria === filtro);
        galeria.innerHTML = filtradas.map((p, index) => {
            const fotosHTML = p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join('');
            return `
            <div class="card">
                <div class="specs" style="margin-bottom: 20px;">ENTRY_NO. 00${index + 1} // ${p.categoria.toUpperCase()}</div>
                <div class="carousel-container">
                    <div class="carousel-track" id="track-${p.id}">${fotosHTML}</div>
                </div>
                <div class="card-info">
                    <div>
                        <h3>${p.nombre}</h3>
                        <div class="specs">SIZE: ${p.talla} / COND: ${p.estado}</div>
                    </div>
                    <div class="price-tag">₡${p.precio}</div>
                </div>
                <button class="btn-adquirir" ${p.disponible ? '' : 'disabled'} onclick="abrirModal('${p.nombre.replace(/'/g, "\\'")}')">
                    ${p.disponible ? 'REQUEST ACCESS' : 'SOLD OUT'}
                </button>
            </div>`;
        }).join('');
    }
    // (Mantener el resto de funciones JS de tu código original)
    cargar();
</script>
</body>
</html>
