        { titulo: "La Detroit Jacket: El Icono del Asfalto", meta: "17 Mar. 2026 — 4 min read", img: "El Oro de Lona La Detroit Jacket.png", short: "No es moda rápida. Es lona de pato de 12 onzas...", content: "No es moda rápida. No es una tendencia de Instagram que desaparece en dos semanas. Es lona de pato de 12 onzas, triple costura y una reputación forjada en el acero y el concreto de Michigan.\n\n(La Historia: Nacida del Vapor)\nHamilton Carhartt no diseñó la Detroit Jacket para las pasarelas en 1889. La diseñó para los hombres que construyeron América: trabajadores del ferrocarril y obreros siderúrgicos. Necesitaban algo que no se rompiera, que resistiera chispas y que los mantuviera calientes sin restringir el movimiento. La Detroit Jacket original (con su corte corto a la cintura y forro de manta) fue la respuesta. Su color 'Carhartt Brown' no era estético; era el color natural de la lona resistente que usaban. Nació de la pura necesidad funcional.\n\n(La Curiosidad: Del Andamio al 'Grunge' y el Hip-Hop)\n¿Cómo pasó de un sitio de construcción a ser la pieza central del streetwear? En los años 90, algo cambió. El movimiento grunge en Seattle adoptó la ropa de trabajo por su autenticidad y durabilidad. Simultáneamente, la escena del Hip-Hop en Nueva York comenzó a usarla como un símbolo de 'dureza' y resistencia urbana.\n\nAquí es donde la Detroit Jacket solidifica su estatus legendario. En el cine, cuando un director necesita que un personaje parezca rudo, honesto y práctico, no le ponen un traje. Le ponen una Carhartt Detroit desgastada.\n\nEn un mundo de consumo desechable, la Carhartt Detroit es una anomalía. Se ve mejor cuando está vieja, manchada y desgastada. Cada rasguño cuenta una historia. No es solo una chaqueta; es un testimonio de que la autenticidad y la función nunca pasan de moda." },
        { titulo: "El Guardián de 1970 Regal Toy Ltd", meta: "12 Mar. 2026 — 3 min read", img: "Regal toy.jpg", short: "En el universo del coleccionismo vintage...", content: "En el universo del coleccionismo vintage, existe una jerarquía invisible. En la cima no están los objetos producidos por millones, sino aquellos que cuentan la historia de una industria que ya no existe.\n\nHoy nos enfocamos en una de nuestras piezas más valiosas: el Regal Toy de la serie First Nations.\n\nRareza de Origen: El Sello de Toronto\nFundada en 1959, Regal Toy Ltd. fue el titán de la manufactura juguetera en Canadá. Poseer una pieza con el grabado original en la espalda no es solo tener un juguete; es poseer un fragmento del patrimonio industrial norteamericano. Tras el cierre de sus fábricas, estas figuras pasaron de los estantes de las tiendas a las vitrinas de los museos de diseño.\n\n⏳ La Exclusividad de la Supervivencia\nLo que hace a este ejemplar de 1970 una pieza de exclusividad absoluta no es solo su edad (más de 55 años), sino su estado de conservación.\n\nEl Vinilo Térmico: A diferencia del plástico moderno que se degrada y se vuelve quebradizo, el vinilo Regal fue diseñado para durar siglos.\n\nLa Pátina del Tiempo: La suavidad de sus facciones y el brillo conservado en su mirada son imposibles de replicar. Es una cápsula del tiempo que ha sobrevivido a décadas de cambios culturales y tecnológicos.\n\n💎 Más que un Objeto, una Inversión Cultural\nEn una era de consumo desechable, la exclusividad reside en la permanencia. Este muñeco representa una época donde el juguete era una obra de arte manual. Su vestimenta de fieltro, sus costuras reforzadas y su diseño étnico detallado lo convierten en un objeto muy interesante." },
        { titulo: "Ebbets Field Flannels: El Heritage Americano", meta: "14 Mar. 2026 — 3 min read", img: "Ebbets Field Flannels2.png", short: "Esta pieza de Ebbets Field Flannels (2014) no es una interpretación moderna...", content: "Esta pieza de Ebbets Field Flannels (2014) no es una interpretación moderna de lo retro; es una réplica exacta de ingeniería textil. Fabricada en Seattle, esta gorra logra capturar el 'look & feel' preciso de los años 40 y 50, manteniendo viva la artesanía que las máquinas actuales han olvidado.\n\n¿Qué la hace una pieza única?\n\nLa Identidad de 'La Casa': A diferencia de las reproducciones de equipos de ligas menores, esta edición limitada porta el logotipo 'EFF' en fieltro blanco. Es la firma de la marca, una declaración de principios para el coleccionista que valora la historia de la propia manufactura.\n\nSu estructura es exactamente igual a las gorras usadas en el diamante hace 80 años. Al no tener los refuerzos rígidos frontales de las gorras modernas, ofrece esa caída natural y perfil bajo que definió la silueta de los jugadores de la era dorada.\n\nTejida con la densidad y el peso originales.\nRecupera el reverso clásico diseñado para mitigar el brillo solar, un sello de autenticidad visual.\nUn cierre robusto y tradicional que refuerza su herencia artesanal.\n\nEn conclusión: Es una pieza de diseño de autor. Combina la exclusividad de una tirada limitada de 2014 con la apariencia visual de una reliquia de 1945. Es, sencillamente, historia viva que puedes usar." },
        { titulo: "El Santo Grial del Denim: El Chaleco AMF Harley-Davidson de los 70", meta: "22 Mar. 2026 — 4 min read", img: "Chaleco_AMF_Harley_70s.png", short: "Este chaleco de mezclilla AMF no es solo una prenda...", content: "En el mundo del coleccionismo vintage, hay piezas que hablan, y luego están las que rugen. Este chaleco representa un capítulo fascinante de la cultura biker, fabricado en un momento de transición donde el estilo se volvió más audaz y rebelde.\n\nLa Era AMF: El Atractivo de lo Rebelde: Para los puristas, la etapa de American Machine and Foundry (1969-1981) es sagrada. Llevar este logo es portar el estandarte de la contracultura de los 70, la década donde el estilo 'Chopper' alcanzó su clímax.\n\nUn Origen Exclusivo: 'British Crown Colony of Hong Kong': Encontrar una pieza Harley con este origen colonial es una rareza geográfica que los expertos buscan con lupa.\n\nCordones de cuero genuino que permitían ajustar la prenda sobre chaquetas gruesas o usarla sola, una solución funcional de la carretera.\n\nUn tejido pesado con un lavado natural que solo décadas de historia pueden lograr.\nMetalistería original en el pecho que aporta ese carácter rudo y protector.\n\nEste chaleco es para el coleccionista que valora la procedencia por encima de todo. Es una pieza fabricada para una leyenda americana en su época más psicodélica. No es solo ropa; es un trozo de asfalto, sudor y libertad de 1970." }

    function cargarGrid(id, lista) {
        document.getElementById(id).innerHTML = lista.map((p, index) => {
            const fotos = p.fotos.map(f => `<img src="${f}" loading="lazy">`).join('');
            const nav = p.fotos.length > 1 ? `<button class="nav-btn prev-btn" onclick="moveCarousel(${p.id}, -1)">←</button><button class="nav-btn next-btn" onclick="moveCarousel(${p.id}, 1)">→</button>` : '';
            const detallePrincipal = p.talla || p.info || "";
            return `<div class="card ${p.disponible?'':'agotado-visual'}" style="animation-delay: ${index * 0.1}s">
                <div class="badge ${p.disponible?'':'agotado'}">${p.disponible?'Disponible':'Agotado'}</div>
                <div class="carousel-container"><div class="carousel-track" id="track-${p.id}">${fotos}</div>${nav}</div>
                <div class="card-info">
                    <h3>${p.nombre}</h3>
                    <p class="precio">₡${p.precio}</p>
                    <div class="specs">${detallePrincipal} // ${p.estado}</div>
                    <button class="btn-adquirir" ${p.disponible?'':'disabled'} onclick="abrirModal('${p.nombre.replace(/'/g, "\\'")}')">
                        ${p.disponible?'Adquirir':'Agotado'}
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function cargarBitacora() {
        document.getElementById('bitacora-grid').innerHTML = bitacora.map((b, index) => `
            <div class="bitacora-item" onclick="abrirLectura(${index})">
                <span class="meta-bitacora" style="font-size:0.65rem; color:var(--oxido); letter-spacing:2px;">${b.meta}</span>
                <div class="img-container"><img src="${b.img}" loading="lazy"></div>
                <h3>${b.titulo}</h3><p style="font-size:0.85rem; opacity:0.6; font-weight:300;">${b.short}</p>
            </div>`).join('');
    }

    window.filtrar = function(cat) {
        document.querySelectorAll('#suministros .filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        let filtrados = cat === 'todas' ? prendas : (cat === 'disponible' ? prendas.filter(p => p.disponible) : prendas.filter(p => p.categoria === cat));
        cargarGrid('galeria', filtrados);
    };

    window.showSection = (id) => {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.moveCarousel = (id, dir) => {
        event.stopPropagation();
        const item = [...prendas, ...articulos].find(p => p.id === id);
        if (!carruselPositions[id]) carruselPositions[id] = 0;
        carruselPositions[id] = (carruselPositions[id] + dir + item.fotos.length) % item.fotos.length;
        document.getElementById(`track-${id}`).style.transform = `translateX(-${carruselPositions[id]*100}%)`;
    };

    window.abrirModal = (n) => { prendaSeleccionadaParaEnvio = n; document.getElementById('modal').style.display = 'flex'; };
    window.cerrarModal = () => document.getElementById('modal').style.display = 'none';
    
    window.abrirLectura = (index) => { 
        const b = bitacora[index];
        document.getElementById('lectura-titulo').innerText = b.titulo; 
        document.getElementById('lectura-texto').innerHTML = b.content.replace(/\n/g, '<br>'); 
        document.getElementById('modal-lectura').style.display = 'flex'; 
        document.body.style.overflow = 'hidden'; 
    };
    
    window.cerrarLectura = () => { 
        document.getElementById('modal-lectura').style.display = 'none'; 
        document.body.style.overflow = 'auto'; 
    };

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        e.preventDefault();
        window.open(`https://wa.me/50683087480?text=${encodeURIComponent("¡Saludos Madlamb.! Soy " + document.getElementById('nombre-cliente').value + ". Me interesa la pieza: " + prendaSeleccionadaParaEnvio + ".")}`, '_blank');
        cerrarModal();
    });

    cargarGrid('galeria', prendas);
    cargarGrid('galeria-articulos', articulos);
    cargarBitacora();
</script>
</body>
