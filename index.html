<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Archive Supply</title>
    <style>
        /* ESTILOS BASE (ESCRITORIO) */
        :root {
            --negro: #1a1a1a;
            --blanco: #f4f4f4;
            --gris: #888;
        }

        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: var(--blanco);
            color: var(--negro);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 90%;
            max-width: 1000px;
            padding: 40px 0;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0;
            text-transform: uppercase;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            text-decoration: none;
            color: var(--negro);
            margin: 0 15px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .hero {
            padding: 60px 20px;
            text-align: center;
            max-width: 800px;
        }

        .hero h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--gris);
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }

        /* GRID DE PIEZAS */
        .container {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 50px;
        }

        .grid-articulos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: white;
            border: 1px solid #eee;
            padding: 15px;
            transition: transform 0.3s;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .card h3 {
            font-size: 1.1rem;
            margin: 15px 0 5px 0;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--gris);
        }

        .btn-whatsapp {
            display: inline-block;
            background: var(--negro);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 40px;
            border-radius: 2px;
            width: auto;
        }

        footer {
            padding: 40px;
            font-size: 0.8rem;
            color: var(--gris);
            text-align: center;
            width: 100%;
        }

        /* ----- MEJORAS PARA CELULAR (MEDIA QUERIES) ----- */
        @media (max-width: 600px) {
            header {
                padding: 20px 0;
            }

            .logo {
                font-size: 1.8rem;
            }

            nav a {
                margin: 0 10px;
                font-size: 0.8rem;
            }

            .hero {
                padding: 40px 15px;
            }

            .hero p {
                font-size: 1.5rem; /* El eslogan se ajusta para no cortarse */
            }

            .grid-articulos {
                grid-template-columns: 1fr; /* Una sola columna en móvil */
                gap: 20px;
            }

            .btn-whatsapp {
                width: 80%; /* Botón más fácil de tocar */
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">MADLAMB.</h1>
        <nav>
            <a href="#">Suministros</a>
            <a href="#">Bitácora</a>
        </nav>
    </header>

    <section class="hero">
        <h2>ARCHIVO</h2>
        <p>Historia que se estrena hoy.</p>
    </section>

    <div class="container">
        <div class="grid-articulos">
            <article class="card">
                <img src="The Waxed Canvas Trucker.jpg" alt="Trucker Jacket">
                <h3>The Waxed Canvas Trucker</h3>
                <p>10 Mar. 2026 — Lectura 3 min</p>
            </article>

            <article class="card">
                <img src="El Oro de Lona La Detroit Jacket.jpg" alt="Detroit Jacket">
                <h3>El Oro de Lona: La Detroit Jacket</h3>
                <p>05 Mar. 2026 — Lectura 2 min</p>
            </article>
        </div>

        <center>
            <a href="https://wa.me/tu-numero" class="btn-whatsapp">ADQUIRIR PIEZA</a>
        </center>
    </div>

    <footer>
        © 2026 MADLAMB. | Archive Supply
    </footer>

</body>
</html>
