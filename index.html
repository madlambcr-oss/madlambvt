<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Heritage Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bronce: #b89166; 
            --acero: #121212;
            --lona: #e0d9d1; 
            --gris-rudo: #1a1a1a;
        }

        body { 
            margin: 0; 
            font-family: 'Montserrat', sans-serif; 
            background-color: #080808; 
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); 
            color: var(--lona); 
            padding-top: 70px;
            overflow-x: hidden;
        }

        /* --- HEADER INDUSTRIAL --- */
        .site-header { 
            background: rgba(0, 0, 0, 0.95); 
            backdrop-filter: blur(15px);
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--bronce);
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
        }

        .site-header h1 { font-weight: 900; font-size: 1.5rem; letter-spacing: 6px; margin: 0; cursor: pointer; color: #fff; }

        .nav-menu ul { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { 
            color: var(--lona); text-decoration: none; font-size: 0.65rem; font-weight: 700; 
            text-transform: uppercase; letter-spacing: 3px; opacity: 0.5; transition: 0.3s;
        }
        .nav-menu a.active { opacity: 1; color: var(--bronce); }

        /* --- SECCIONES --- */
        .content-section { display: none; animation: slideUp 0.6s ease-out; }
        .content-section.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* --- HERO --- */
        .hero { 
            padding: 6rem 1rem; text-align: center; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1520639889413-5d5586a98235?q=80&w=1600');
            background-size: cover; background-position: center;
            border-bottom: 1px solid #333;
        }
        .hero h2 { font-size: 3.5rem; font-weight: 900; letter-spacing: 15px; margin: 0; text-transform: uppercase; color: #fff; }
        .hero p { color: var(--bronce); letter-spacing: 5px; text-transform: uppercase; font-size: 0.8rem; margin-top: 10px; }

        /* --- GRID Y TARJETAS --- */
        .main-container { max-width: 1300px; margin: 0 auto; padding: 3rem 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }

        .card { 
            background: var(--gris-rudo); 
            border-bottom: 4px solid #222;
            transition: 0.4s; position: relative;
        }
        .card:hover { border-bottom-color: var(--bronce); transform: translateY(-5px); }

        /* --- CARRUSEL --- */
        .carousel-container { position: relative; width: 100%; height: 450px; overflow: hidden; background: #000; }
        .carousel-track { display: flex; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); height: 100%; }
        .carousel-track img { min-width: 100%; width: 100%; object-fit: cover; }

        .nav-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0,0,0,0.7); color: white; border: none; 
            width: 40px; height: 60px; cursor: pointer; z-index: 10; font-size: 1.5rem;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: var(--bronce); color: #000; }
        .prev-btn { left: 0; }
        .next-btn { right: 0; }

        /* --- INFO PRENDA --- */
        .card-info { padding: 2rem; }
        .card-info h3 { font-size: 0.9rem; font-weight: 700; letter-spacing: 2px; margin: 0; text-transform: uppercase; line-height: 1.4; min-height: 2.8em; }
        .precio { font-size: 1.4rem; color: var(--bronce); margin: 15px 0; font-weight: 400; font-family: 'monospace'; }

        .btn-adquirir { 
            background: var(--bronce); color: #000; padding: 1.2rem; 
            border: none; font-weight: 900; text-transform: uppercase; 
            cursor: pointer; letter-spacing: 4px; width: 100%; font-size: 0.75rem;
            transition: 0.3s;
        }
        .btn-adquirir:hover { background: #fff; }

        /* --- MODAL --- */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: #111; border: 1px solid var(--bronce); padding: 3rem; width: 90%; max-width: 400px; text-align: center; }
        .modal-content h3 { color: var(--bronce); letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        input { width: 100%; padding: 15px; margin: 10px 0 20px; background: #222; border: 1px solid #333; color: #fff; font-family: 'Montserrat'; text-align: center; outline: none; }
        input:focus { border-color: var(--bronce); }

        footer { text-align: center; padding: 5rem; opacity: 0.3; font-size: 0.6rem; letter-spacing: 4px; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul>
            <li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
            <li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
        </ul>
    </nav>
</header>

<section id="suministros" class="content-section active">
    <div class="hero"><h2>VAULT 01</h2><p>HERITAGE SUPPLY CO.</p></div>
    <div class="main-container"><div class="grid" id="galeria"></div></div>
</section>

<section id="bitacora" class="content-section">
    <div style="padding: 10rem 1rem 4rem; text-align: center;">
        <h2 style="letter-spacing: 20px; font-size: 3rem; margin: 0; color: #fff;">ARCHIVO</h2>
    </div>
    <div class="main-container" style="text-align: center; font-weight: 300; color: #888;">
        <p>HISTORIAS DE RESISTENCIA EN PROCESO DE CARGA...</p>
    </div>
</section>

<div id="modal">
    <div class="modal-content">
        <h3 id="modal-titulo">ORDENAR</h3>
        <form id="form-pedido">
            <input type="text" id="nombre-cliente" placeholder="ESCRIBE TU NOMBRE COMPLETO" required>
            <p style="font-size: 0.6rem; color: #666; margin-bottom: 20px; letter-spacing: 1px;">PAGO VÍA SINPE / TRANSFERENCIA. ENVÍO A COORDINAR.</p>
            <button type="submit" class="btn-adquirir">DESBLOQUEAR EN WHATSAPP</button>
            <button type="button" onclick="cerrarModal()" style="color:#555; margin-top:20px; cursor:pointer; background:none; border:none; font-size: 0.6rem; letter-spacing: 2px;">CANCELAR</button>
        </form>
    </div>
</div>

<footer>© 2026 MADLAMB. | SAN JOSÉ, COSTA RICA</footer>

<script>
    let prendaSeleccionadaParaEnvio = "";
    const carruselPositions = {};

    function showSection(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        window.scrollTo(0,0);
    }

    // LISTA DE PRENDAS RECUPERADA COMPLETA
    const prendas = [
        { id: 1, nombre: "HOODIE UNDER ARMOUR 'REAL TREE'", precio: "35,000", fotos: ["Hoodie under armour real tree.jpg", "Hoodie real tree2.jpg", "Hoodie real tree3.jpg"] },
        { id: 2, nombre: "CARHARTT DETROIT 100 AÑOS", precio: "50,000", fotos: ["Carharrt Detroit 100 años.jpg", "Carhartt Detroit2.jpg", "Carhartt Detroit3.jpg"] },
        { id: 3, nombre: "WINDBREAKER PLAYBOY", precio: "25,000", fotos: ["Windbreaker PlayBoy.jpg"] },
        { id: 4, nombre: "T-SHIRT GALLERY DEPT. 'TOKYO' EDITION", precio: "35,000", fotos: ["Gallery dept. tokyo edition.jpg"] },
        { id: 5, nombre: "ONEITA 'LOSER' TEE", precio: "50,000", fotos: ["Oneita loser tee.jpg"] }
    ];

    function cargar() {
        const galeria = document.getElementById('galeria');
        galeria.innerHTML = prendas.map((p, pIndex) => {
            const fotosHTML = p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join('');
            const botonesNav = p.fotos.length > 1 ? `
                <button class="nav-btn prev-btn" onclick="moveCarousel(${pIndex}, -1)">&#10094;</button>
                <button class="nav-btn next-btn" onclick="moveCarousel(${pIndex}, 1)">&#10095;</button>
            ` : '';

            return `
            <div class="card">
                <div class="carousel-container">
                    <div class="carousel-track" id="track-${pIndex}">
                        ${fotosHTML}
                    </div>
                    ${botonesNav}
                </div>
                <div class="card-info">
                    <h3>${p.nombre}</h3>
                    <p class="precio">₡${p.precio}</p>
                    <button class="btn-adquirir" onclick="abrirModal('${p.nombre}')">ADQUIRIR</button>
                </div>
            </div>`;
        }).join('');
    }

    window.moveCarousel = function(pIndex, direction) {
        const track = document.getElementById(`track-${pIndex}`);
        const totalFotos = prendas[pIndex].fotos.length;
        if (!carruselPositions[pIndex]) carruselPositions[pIndex] = 0;
        
        carruselPositions[pIndex] += direction;

        if (carruselPositions[pIndex] < 0) carruselPositions[pIndex] = totalFotos - 1;
        if (carruselPositions[pIndex] >= totalFotos) carruselPositions[pIndex] = 0;

        track.style.transform = `translateX(-${carruselPositions[pIndex] * 100}%)`;
    };

    window.abrirModal = function(nombre) {
        prendaSeleccionadaParaEnvio = nombre;
        document.getElementById('modal-titulo').innerText = "SUMINISTRO: " + nombre;
        document.getElementById('modal').style.display = 'flex';
    };

    window.cerrarModal = function() { document.getElementById('modal').style.display = 'none'; };

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        e.preventDefault();
        const cliente = document.getElementById('nombre-cliente').value;
        const msg = `¡Saludos Madlamb.! Soy ${cliente}. Me interesa comprar: ${prendaSeleccionadaParaEnvio}.`;
        window.open("https://wa.me/50683087480?text=" + encodeURIComponent(msg), '_blank');
        cerrarModal();
    });

    cargar();
</script>
</body>
</html>
