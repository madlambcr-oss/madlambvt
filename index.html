<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Archive Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:italic,wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505;
            --accent: #ffffff;
            --text-secondary: #888;
            --border: rgba(255, 255, 255, 0.1);
            --oxido: #b35a38; 
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg); color: var(--accent);
            padding-top: 80px;
            overflow-x: hidden;
        }

        /* --- Header: Fijo y Proporcional --- */
        .site-header { 
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px);
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid var(--border);
        }
        .site-header h1 { font-weight: 900; font-size: 1.4rem; letter-spacing: 2px; margin: 0; cursor: pointer; }
        .nav-menu ul { display: flex; gap: 2.5rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; opacity: 0.5; transition: var(--transition); cursor: pointer; }
        .nav-menu a.active, .nav-menu a:hover { opacity: 1; color: var(--oxido); }

        .content-section { display: none; }
        .content-section.active { display: block; }

        /* --- Hero --- */
        .hero-banner { 
            height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('banner-vintage.png') center/cover;
            border-bottom: 1px solid var(--border);
        }
        .hero-banner h2 { font-size: clamp(3rem, 8vw, 6rem); font-weight: 900; margin: 0; letter-spacing: -2px; }

        /* --- Filtros --- */
        .filter-bar { padding: 2rem 5%; display: flex; justify-content: center; gap: 1.5rem; border-bottom: 1px solid var(--border); }
        .filter-btn { background: none; border: 1px solid var(--border); color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; padding: 10px 20px; transition: var(--transition); font-size: 0.75rem; }
        .filter-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* --- Grid de Productos: 3 Columnas (Equilibrado) --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 1px; 
            background: var(--border);
        }
        .card { background: var(--bg); padding: 2.5rem; transition: var(--transition); }
        
        .carousel-container { 
            position: relative; width: 100%; aspect-ratio: 1 / 1.2; 
            overflow: hidden; margin-bottom: 20px; border: 1px solid var(--border);
        }
        .carousel-track { display: flex; height: 100%; transition: transform 0.5s ease; }
        .carousel-track img { min-width: 100%; object-fit: cover; }

        .card-info h3 { font-size: 1.2rem; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; }
        .precio { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--oxido); margin-bottom: 12px; }
        .specs { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 25px; }

        .btn-adquirir { 
            background: #fff; color: #000; padding: 15px; border: none; width: 100%; 
            font-size: 0.8rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; 
        }

        /* --- Bitácora --- */
        .bitacora-item { padding: 5rem 10%; border-bottom: 1px solid var(--border); max-width: 900px; margin: 0 auto; }
        .bitacora-item h3 { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; margin-bottom: 20px; }
        .bitacora-item p { font-size: 1.1rem; line-height: 1.7; color: #ccc; text-align: justify; }
        .bitacora-img { width: 100%; height: 450px; object-fit: cover; margin-bottom: 30px; border: 1px solid var(--border); }

        /* Modales */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { max-width: 700px; width: 100%; background: #000; border: 1px solid var(--border); padding: 40px; }
        input { width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid #333; background: transparent; font-size: 1.8rem; color: #fff; margin-bottom: 30px; outline: none; text-align: center; }

        footer { padding: 4rem; text-align: center; border-top: 1px solid var(--border); font-size: 0.7rem; color: #444; letter-spacing: 5px; }

        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul>
            <li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
            <li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
        </ul>
    </nav>
</header>

<section id="suministros" class="content-section active">
    <div class="hero-banner">
        <h2>ARCHIVE SUPPLY</h2>
    </div>
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrar('todas')">Todo</button>
        <button class="filter-btn" onclick="filtrar('jackets')">Jackets</button>
        <button class="filter-btn" onclick="filtrar('hoodies')">Hoodies</button>
        <button class="filter-btn" onclick="filtrar('camisetas')">T-Shirts</button>
    </div>
    <div class="grid" id="galeria"></div>
</section>

<section id="bitacora" class="content-section">
    <div style="text-align: center; padding: 6rem 0 2rem;">
        <h2 style="font-size: 4rem; font-weight: 900; letter-spacing: -2px;">LEGADO</h2>
    </div>
    <div id="bitacora-container">
        <article class="bitacora-item" onclick="abrirLectura('The Waxed Canvas Trucker', 'La chaqueta de lona encerada es mucho más que una prenda; es una herencia de ingeniería textil que nació en el siglo XV para proteger a los marineros de los climas más hostiles. Desde las velas de alta mar hasta las icónicas rutas de motociclismo, este material ha evolucionado utilizando fibras como el algodón Martexin y remaches de cobre para ofrecer una resistencia hercúlea y eterna. A diferencia de la moda desechable, su valor real reside en la pátina que desarrolla con el tiempo, transformando cada arruga y marca en una crónica visual de las aventuras de quien la viste, convirtiéndola en una inversión única diseñada para pasar de generación en generación.')">
            <span style="color:var(--oxido); font-weight:700;">REG_01</span>
            <h3>The Waxed Canvas Trucker</h3>
            <img src="The Waxed Canvas Trucker.jpg" class="bitacora-img">
            <p>La chaqueta de lona encerada es mucho más que una prenda; es una herencia de ingeniería textil...</p>
        </article>
        </div>
</section>

<div id="modal" class="modal">
    <div class="modal-content">
        <form id="form-pedido">
            <h3 style="letter-spacing: 2px;">SOLICITAR PIEZA</h3>
            <input type="text" id="nombre-cliente" placeholder="TU NOMBRE" required>
            <button type="submit" class="btn-adquirir">IR A WHATSAPP</button>
            <p onclick="cerrarModal()" style="margin-top:20px; cursor:pointer; opacity:0.5;">Cerrar</p>
        </form>
    </div>
</div>

<div id="modal-lectura" class="modal">
    <div class="modal-content">
        <h3 id="lectura-titulo" style="font-family: 'Playfair Display', serif; font-style: italic;"></h3>
        <div id="lectura-texto" style="font-size: 1rem; line-height: 1.6; color: #ccc;"></div>
        <button type="button" onclick="cerrarLectura()" class="btn-adquirir" style="margin-top:30px;">Cerrar Registro</button>
    </div>
</div>

<footer>© 2026 MADLAMB. | ARCHIVE SUPPLY</footer>

<script>
    let prendaSeleccionadaParaEnvio = "";
    const carruselPositions = {};

    const prendas = [
        { id: 1, nombre: "HOODIE UNDER ARMOUR 'REAL TREE'", precio: "35,000", talla: "L", estado: "10/10", categoria: "hoodies", fotos: ["Hoodie under armour real tree.jpg"], disponible: true },
        { id: 2, nombre: "CARHARRT DETROIT '100 AÑOS'", precio: "50,000", talla: "L", estado: "8.5/10", categoria: "jackets", fotos: ["Carharrt Detroit 100 años.jpg"], disponible: true },
        { id: 3, nombre: "WINDBREAKER PLAYBOY", precio: "25,000", talla: "M", estado: "9/10", categoria: "jackets", fotos: ["Windbreaker PlayBoy.jpg","Windbreaker PlayBoy2.jpg","Windbreaker PlayBoy3.jpg"], disponible: true },
        { id: 4, nombre: "T-SHIRT GALLERY DEPT. 'TOKYO' EDITION", precio: "35,000", talla: "M", estado: "10/10", categoria: "camisetas", fotos: ["Gallery dept. tokyo edition.jpg","Gallery dept. tokyo edition2.jpg"], disponible: true },
        { id: 5, nombre: "ONEITA 'LOSER' TEE 'VINTAGE'", precio: "50,000", talla: "L", estado: "9/10", categoria: "camisetas", fotos: ["Oneita loser tee.jpg","Oneita loser tee2.jpg"], disponible: true },
        { id: 6, nombre: "CARHARTT ACTIVE 'FLANNEL LINED'", precio: "110,000", talla: "M", estado: "9/10", categoria: "jackets", fotos: ["Carhartt Active 'Flannel Lined'.jpg","Carhartt Active 'Flannel Lined2'.jpg"], disponible: false }
    ];

    function cargar(filtro = 'todas') {
        const galeria = document.getElementById('galeria');
        const filtradas = filtro === 'todas' ? prendas : prendas.filter(p => p.categoria === filtro);
        galeria.innerHTML = filtradas.map((p) => {
            const fotosHTML = p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join('');
            return `<div class="card">
                <div class="carousel-container">
                    <div class="carousel-track" id="track-${p.id}">${fotosHTML}</div>
                    <div style="position:absolute; top:10px; left:10px; background:white; color:black; padding:4px 8px; font-size:10px; font-weight:900;">${p.disponible ? 'DISPONIBLE' : 'AGOTADO'}</div>
                </div>
                <div class="card-info">
                    <h3>${p.nombre}</h3>
                    <p class="precio">₡${p.precio}</p>
                    <div class="specs">Talla: ${p.talla} / Cond: ${p.estado}</div>
                    <button class="btn-adquirir" ${p.disponible ? '' : 'disabled'} onclick="abrirModal('${p.nombre.replace(/'/g, "\\'")}')">
                        ${p.disponible ? 'Adquirir' : 'Agotado'}
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    // Funciones de navegación y modales corregidas
    window.showSection = function(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.filtrar = function(cat) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        cargar(cat);
    };

    window.abrirModal = function(n) { prendaSeleccionadaParaEnvio = n; document.getElementById('modal').style.display = 'flex'; };
    window.cerrarModal = function() { document.getElementById('modal').style.display = 'none'; };
    window.abrirLectura = function(t, txt) {
        document.getElementById('lectura-titulo').innerText = t;
        document.getElementById('lectura-texto').innerHTML = `<p>${txt.replace(/\n/g, '</p><p>')}</p>`;
        document.getElementById('modal-lectura').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    };
    window.cerrarLectura = function() { document.getElementById('modal-lectura').style.display = 'none'; document.body.style.overflow = 'auto'; };

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        e.preventDefault();
        const cliente = document.getElementById('nombre-cliente').value;
        const msg = `¡Saludos Madlamb.! Soy ${cliente}. Me interesa: ${prendaSeleccionadaParaEnvio}.`;
        window.open("https://wa.me/50683087480?text=" + encodeURIComponent(msg), '_blank');
        cerrarModal();
    });

    cargar();
</script>
</body>
</html>
