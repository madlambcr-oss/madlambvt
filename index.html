<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADLAMB. | Archive Supply</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">

<style>

:root { 
--bg: #f4f4f4;
--negro: #000000;
--gris: #888888;
--gris-claro: #dddddd;
--rojo-agotado: #a30000;
--transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

body { 
margin:0;
font-family:'Inter',sans-serif;
background-color:var(--bg);
color:var(--negro);
padding-top:60px;
overflow-x:hidden;
}

.site-header{ 
background:rgba(244,244,244,0.9);
backdrop-filter:blur(10px);
padding:0.8rem 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
width:100%;
z-index:1000;
border-bottom:1px solid var(--gris-claro);
}

.site-header h1{
font-weight:900;
font-size:1.2rem;
letter-spacing:-0.5px;
margin:0;
cursor:pointer;
}

.nav-menu ul{
display:flex;
gap:2rem;
list-style:none;
margin:0;
padding:0;
}

.nav-menu a{
color:var(--negro);
text-decoration:none;
font-size:0.65rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:1.5px;
opacity:0.4;
cursor:pointer;
}

.nav-menu a.active,
.nav-menu a:hover{
opacity:1;
}

.content-section{
display:none;
}

.content-section.active{
display:block;
}

.hero{
padding:8rem 5% 2rem;
}

.hero h2{
font-size:clamp(3rem,12vw,8rem);
font-weight:900;
line-height:0.8;
margin:0;
letter-spacing:-4px;
text-transform:uppercase;
}

.hero p{
font-family:'Playfair Display',serif;
font-size:1.5rem;
margin-top:20px;
color:var(--gris);
}

.hero-sub{
font-size:0.7rem;
letter-spacing:2px;
text-transform:uppercase;
color:var(--gris);
}

.filter-bar{
padding:2rem 5%;
border-bottom:1px solid var(--gris-claro);
display:flex;
gap:1.5rem;
overflow-x:auto;
}

.filter-btn{
background:none;
border:none;
font-size:0.65rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:1.5px;
cursor:pointer;
opacity:0.4;
}

.filter-btn.active,
.filter-btn:hover{
opacity:1;
border-bottom:1px solid var(--negro);
}

.main-container{
max-width:1400px;
margin:0 auto;
padding:4rem 5%;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:1px;
background-color:var(--gris-claro);
border:1px solid var(--gris-claro);
}

.card{
background:var(--bg);
padding:20px;
position:relative;
}

.carousel-container{
position:relative;
width:100%;
height:500px;
overflow:hidden;
margin-bottom:20px;
background:#eee;
}

.carousel-track{
display:flex;
width:100%;
height:100%;
transition:transform 0.6s cubic-bezier(0.16,1,0.3,1);
}

.carousel-track img{
min-width:100%;
width:100%;
height:100%;
object-fit:cover;
filter:grayscale(100%);
transition:transform 0.8s ease,filter 0.5s ease;
}

.card:hover img{
filter:grayscale(0%);
transform:scale(1.05);
}

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,0.8);
border:none;
font-size:1.5rem;
cursor:pointer;
opacity:0;
width:40px;
height:40px;
border-radius:50%;
}

.card:hover .nav-btn{
opacity:0.5;
}

.card-info h3{
font-size:0.85rem;
font-weight:700;
text-transform:uppercase;
margin:0;
}

.precio{
font-size:0.85rem;
color:var(--gris);
margin:5px 0 10px;
}

.specs{
font-size:0.65rem;
color:var(--gris);
text-transform:uppercase;
letter-spacing:1px;
margin-bottom:20px;
font-weight:600;
}

.btn-adquirir{
background:var(--negro);
color:#fff;
padding:14px;
border:none;
width:100%;
font-size:0.7rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:2px;
cursor:pointer;
}

.bitacora-header{
padding:8rem 5% 2rem;
}

.bitacora-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:4rem;
max-width:1200px;
margin:0 auto;
padding:0 5% 5rem;
}

.bitacora-item img{
width:100%;
height:600px;
object-fit:cover;
margin-bottom:20px;
}

footer{
padding:5rem;
text-align:center;
border-top:1px solid var(--gris-claro);
font-size:0.6rem;
font-weight:700;
letter-spacing:2px;
text-transform:uppercase;
opacity:0.5;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.98);
justify-content:center;
align-items:center;
z-index:9999;
}

.modal-content{
text-align:center;
width:90%;
max-width:500px;
}

input{
width:100%;
padding:20px;
border:none;
border-bottom:2px solid var(--negro);
background:transparent;
font-size:1.5rem;
outline:none;
text-align:center;
margin-bottom:30px;
}

</style>
</head>

<body>

<header class="site-header">
<h1 onclick="showSection('suministros')">MADLAMB.</h1>

<nav class="nav-menu">
<ul>
<li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
<li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
</ul>
</nav>
</header>

<section id="suministros" class="content-section active">

<div class="hero">
<h2>Archivo<br>Madlamb</h2>
<p><i>Historia & Legado</i></p>
<span class="hero-sub">Curaduría de piezas vintage seleccionadas una a una.</span>
</div>

<div class="filter-bar">
<button class="filter-btn active" onclick="filtrar('todas')">Todas</button>
<button class="filter-btn" onclick="filtrar('chaquetas')">Chaquetas</button>
<button class="filter-btn" onclick="filtrar('hoodies')">Hoodies</button>
<button class="filter-btn" onclick="filtrar('camisetas')">Camisetas</button>
</div>

<div class="main-container">
<div class="grid" id="galeria"></div>
</div>

</section>

<section id="bitacora" class="content-section">

<div class="bitacora-header">
<h2 style="font-size:5rem;font-weight:900;margin:0;">EL LEGADO.</h2>
</div>

<div class="bitacora-grid" id="bitacora-grid"></div>

</section>

<footer>
© 2026 MADLAMB. | CURATED IN SAN JOSÉ, COSTA RICA
</footer>

<div id="modal" class="modal">
<div class="modal-content">
<h3 style="font-size:2rem;text-transform:uppercase;font-weight:900;">Adquirir</h3>
<form id="form-pedido">
<input type="text" id="nombre-cliente" placeholder="TU NOMBRE" required>
<button type="submit" class="btn-adquirir">CONTINUAR A WHATSAPP</button>
</form>
</div>
</div>

<script src="data.js"></script>
<script src="main.js"></script>

</body>
</html>
