<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Home Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --amarillo: #f7e018;
            --naranja: #ff5c00;
            --menta: #00c49a;
            --blanco: #ffffff;
            --negro: #000000;
        }

        body { 
            margin: 0; 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--blanco);
            color: var(--negro);
            overflow-x: hidden;
            padding-top: 70px;
        }

        /* --- HEADER TIPO CINTA (TAPE) --- */
        .site-header { 
            background: var(--negro); 
            padding: 0.8rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000;
            border-bottom: 4px solid var(--negro);
        }

        .site-header h1 { 
            color: var(--blanco);
            font-size: 1.5rem; letter-spacing: -1px; margin: 0; 
            text-transform: uppercase; cursor: pointer;
        }

        .nav-menu ul { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { 
            color: var(--blanco); text-decoration: none; font-size: 0.7rem; font-weight: 900; 
            text-transform: uppercase; padding: 5px 10px; transition: 0.2s;
        }
        .nav-menu a:hover, .nav-menu a.active { background: var(--amarillo); color: var(--negro); }

        /* --- SECCIONES --- */
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* --- HERO COLLAGE --- */
        .hero { 
            height: 60vh;
            display: flex; align-items: center; justify-content: center;
            background: 
                linear-gradient(45deg, var(--amarillo) 25%, transparent 25%),
                linear-gradient(-45deg, var(--amarillo) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--amarillo) 75%),
                linear-gradient(-45deg, transparent 75%, var(--amarillo) 75%);
            background-size: 20px 20px;
            background-color: #e5e5f7; /* Color de fondo de los puntos */
            border-bottom: 10px solid var(--negro);
            position: relative;
        }

        .hero-title-box {
            background: var(--blanco);
            border: 8px solid var(--negro);
            padding: 2rem 4rem;
            transform: rotate(-2deg);
            box-shadow: 15px 15px 0px var(--negro);
        }

        .hero h2 { 
            font-size: clamp(3rem, 10vw, 6rem); margin: 0; 
            line-height: 0.9; text-transform: uppercase; letter-spacing: -2px;
        }

        /* --- GRID DE PRODUCTOS --- */
        .main-container { 
            padding: 4rem 5%; 
            background-image: radial-gradient(var(--negro) 10%, transparent 10%);
            background-size: 20px 20px; /* Patrón de puntos pop-art */
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 40px; 
        }

        /* --- TARJETA ESTILO RECORTE --- */
        .card { 
            background: var(--blanco); 
            border: 5px solid var(--negro);
            transition: 0.3s;
            position: relative;
            box-shadow: 10px 10px 0px var(--negro);
        }
        .card:hover { transform: translate(-5px, -5px); box-shadow: 15px 15px 0px var(--naranja); }

        .carousel-container { position: relative; width: 100%; height: 380px; overflow: hidden; border-bottom: 5px solid var(--negro); }
        .carousel-track { display: flex; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); height: 100%; }
        .carousel-track img { min-width: 100%; object-fit: cover; }

        .nav-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: var(--amarillo); color: var(--negro); border: 3px solid var(--negro); 
            width: 40px; height: 40px; cursor: pointer; font-weight: 900; z-index: 10;
        }

        .card-info { padding: 1.5rem; background: var(--blanco); }
        .card-info h3 { font-size: 1.2rem; text-transform: uppercase; margin: 0; line-height: 1; }
        .precio { 
            display: inline-block;
            background: var(--negro); color: var(--blanco);
            padding: 5px 15px; font-size: 1.5rem; margin: 15px 0;
            transform: rotate(2deg);
        }

        .btn-adquirir { 
            background: var(--menta); color: var(--negro); padding: 1rem; 
            border: 4px solid var(--negro); font-weight: 900; text-transform: uppercase; 
            cursor: pointer; width: 100%; font-size: 1rem; transition: 0.2s;
        }
        .btn-adquirir:hover { background: var(--naranja); color: var(--blanco); }

        /* --- MODAL --- */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(247, 224, 24, 0.9); justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--blanco); border: 10px solid var(--negro); padding: 3rem; width: 90%; max-width: 400px; text-align: center; box-shadow: 20px 20px 0px var(--negro); }
        input { width: 100%; padding: 15px; margin: 20px 0; border: 4px solid var(--negro); font-size: 1.2rem; font-weight: 900; text-transform: uppercase; }

        footer { background: var(--negro); color: var(--blanco); text-align: center; padding: 3rem; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul>
            <li><a id="nav-suministros" class="active" onclick="showSection('suministros')">Suministros</a></li>
            <li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
        </ul>
    </nav>
</header>

<section id="suministros" class="content-section active">
    <div class="hero">
        <div class="hero-title-box">
            <h2>MADLAMB<br><span style="color:var(--naranja)">IN STORE</span></h2>
        </div>
    </div>
    
    <div class="main-container">
        <div class="grid" id="galeria"></div>
    </div>
</section>

<section id="bitacora" class="content-section">
    <div style="background: var(--menta); padding: 10rem 1rem; text-align: center; border-bottom: 10px solid var(--negro);">
        <h2 style="font-size: 5rem; text-transform: uppercase; margin: 0; color: var(--blanco); -webkit-text-stroke: 4px var(--negro);">Bitácora</h2>
    </div>
</section>

<div id="modal">
    <div class="modal-content">
        <h2 style="margin:0; font-size: 2rem;">¿LO QUIERES?</h2>
        <form id="form-pedido">
            <input type="text" id="nombre-cliente" placeholder="TU NOMBRE" required>
            <button type="submit" class="btn-adquirir">IR A WHATSAPP</button>
            <button type="button" onclick="cerrarModal()" style="margin-top:20px; background:none; border:none; font-weight: 900; cursor:pointer; text-decoration: underline;">CANCELAR</button>
        </form>
    </div>
</div>

<footer>© 2026 MADLAMB. | STREET HERITAGE | SAN JOSÉ</footer>

<script>
    let prendaSeleccionadaParaEnvio = "";
    const carruselPositions = {};

    function showSection(id) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('nav-' + id).classList.add('active');
        window.scrollTo(0,0);
    }

    const prendas = [
        { id: 1, nombre: "HOODIE UNDER ARMOUR 'REAL TREE'", precio: "35,000", fotos: ["Hoodie under armour real tree.jpg"] },
        { id: 2, nombre: "CARHARRT DETROIT '100 AÑOS'", precio: "50,000", fotos: ["Carharrt Detroit 100 años.jpg"] },
        { id: 3, nombre: "WINDBREAKER PLAYBOY 'ARCHIVE'", precio: "25,000", fotos: ["Windbreaker PlayBoy.jpg","Windbreaker PlayBoy2.jpg","Windbreaker PlayBoy3.jpg"] },
        { id: 4, nombre: "T-SHIRT GALLERY DEPT. 'TOKYO' EDITION", precio: "35,000", fotos: ["Gallery dept. tokyo edition.jpg","Gallery dept. tokyo edition2.jpg"] },
        { id: 5, nombre: "ONEITA 'LOSER' TEE 'VINTAGE'", precio: "50,000", fotos: ["Oneita loser tee.jpg","Oneita loser tee2.jpg"] }
    ];

    function cargar() {
        const galeria = document.getElementById('galeria');
        galeria.innerHTML = prendas.map((p, pIndex) => {
            const fotosHTML = p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join('');
            const botonesNav = p.fotos.length > 1 ? `
                <button class="nav-btn prev-btn" onclick="moveCarousel(${pIndex}, -1)">&#10094;</button>
                <button class="nav-btn next-btn" onclick="moveCarousel(${pIndex}, 1)">&#10095;</button>
            ` : '';

            return `
            <div class="card">
                <div class="carousel-container">
                    <div class="carousel-track" id="track-${pIndex}">
                        ${fotosHTML}
                    </div>
                    ${botonesNav}
                </div>
                <div class="card-info">
                    <h3>${p.nombre}</h3>
                    <div class="precio">₡${p.precio}</div>
                    <button class="btn-adquirir" onclick="abrirModal('${p.nombre}')">COMPRAR YA</button>
                </div>
            </div>`;
        }).join('');
    }

    window.moveCarousel = function(pIndex, direction) {
        const track = document.getElementById(`track-${pIndex}`);
        const totalFotos = prendas[pIndex].fotos.length;
        if (!carruselPositions[pIndex]) carruselPositions[pIndex] = 0;
        carruselPositions[pIndex] += direction;
        if (carruselPositions[pIndex] < 0) carruselPositions[pIndex] = totalFotos - 1;
        if (carruselPositions[pIndex] >= totalFotos) carruselPositions[pIndex] = 0;
        track.style.transform = `translateX(-${carruselPositions[pIndex] * 100}%)`;
    };

    window.abrirModal = function(nombre) {
        prendaSeleccionadaParaEnvio = nombre;
        document.getElementById('modal').style.display = 'flex';
    };

    window.cerrarModal = function() { document.getElementById('modal').style.display = 'none'; };

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        e.preventDefault();
        const cliente = document.getElementById('nombre-cliente').value;
        const msg = `¡Saludos Madlamb.! Soy ${cliente}. Me interesa comprar: ${prendaSeleccionadaParaEnvio}.`;
        window.open("https://wa.me/50683087480?text=" + encodeURIComponent(msg), '_blank');
        cerrarModal();
    });

    cargar();
</script>
</body>
</html>
