<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADLAMB. | Archive Supply</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700;900&family=Playfair+Display:italic,wght@700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#050505;
--surface:#0d0d0d;
--accent:#ffffff;
--text-secondary:#888888;
--chrome:#c0c0c0;
--rojo-agotado:#a30000;
--transition:all 0.8s cubic-bezier(0.16,1,0.3,1);
}

/* GLOBAL */

body{
margin:0;
font-family:'Inter',sans-serif;
background-color:var(--bg);
color:var(--accent);
padding-top:80px;
overflow-x:hidden;
-webkit-font-smoothing:antialiased;
}

#preloader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:10000;
display:flex;
justify-content:center;
align-items:center;
transition:opacity 1.5s ease;
}

#preloader h2{
font-weight:200;
letter-spacing:25px;
font-size:0.8rem;
text-transform:uppercase;
color:#fff;
}

@keyframes revealSlight{
from{opacity:0;transform:translateY(20px);filter:blur(10px);}
to{opacity:1;transform:translateY(0);filter:blur(0);}
}

/* HEADER */

.site-header{
background:rgba(5,5,5,0.85);
backdrop-filter:blur(25px);
padding:1.5rem 5%;
display:flex;
justify-content:space-between;
align-items:center;
position:fixed;
top:0;
width:100%;
z-index:1000;
box-sizing:border-box;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.site-header h1{
font-weight:900;
font-size:1.2rem;
letter-spacing:4px;
margin:0;
cursor:pointer;
text-transform:uppercase;
}

.nav-menu ul{
display:flex;
gap:3rem;
list-style:none;
margin:0;
padding:0;
}

.nav-menu a{
color:var(--accent);
text-decoration:none;
font-size:0.65rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:3px;
opacity:0.3;
transition:var(--transition);
cursor:pointer;
}

.nav-menu a.active,
.nav-menu a:hover{
opacity:1;
text-shadow:0 0 15px rgba(255,255,255,0.5);
}

.content-section{display:none;}
.content-section.active{display:block;}

/* HERO */

.hero{
padding:12rem 5% 6rem;
text-align:center;
}

.hero h2{
font-size:clamp(3rem,15vw,12rem);
font-weight:900;
line-height:0.8;
margin:0;
letter-spacing:-8px;
text-transform:uppercase;
background:linear-gradient(180deg,#fff 0%,#444 100%);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:revealSlight 2s var(--transition);
}

.hero p{
font-family:'Playfair Display',serif;
font-size:1.5rem;
color:var(--text-secondary);
margin-top:25px;
letter-spacing:1px;
font-style:italic;
}

/* FILTERS */

.filter-bar{
padding:0 5% 4rem;
display:flex;
justify-content:center;
gap:4rem;
overflow-x:auto;
scrollbar-width:none;
}

.filter-btn{
background:none;
border:none;
color:var(--accent);
font-size:0.65rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:4px;
cursor:pointer;
opacity:0.2;
transition:var(--transition);
white-space:nowrap;
}

.filter-btn.active,
.filter-btn:hover{
opacity:1;
}

/* GALERIA */

.main-container{
max-width:1800px;
margin:0 auto;
padding:0 5% 10rem;
}

.grid{
display:grid;

/* CORRECCION MOBILE */
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));

gap:80px;
}

.card{
position:relative;
animation:revealSlight 1.5s var(--transition) backwards;
}

.card:hover .carousel-container{
transform:scale(1.02);
}

.badge{
position:absolute;
top:20px;
left:20px;
z-index:20;
padding:6px 16px;
font-size:0.55rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:3px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
color:var(--accent);
border:1px solid rgba(255,255,255,0.1);
}

.badge.agotado{
color:#ff4444;
border-color:#ff4444;
background:rgba(255,0,0,0.05);
}

.carousel-container{
position:relative;
width:100%;
aspect-ratio:1 / 1.25;
overflow:hidden;
margin-bottom:35px;
background:#111;
transition:var(--transition);
border-radius:2px;
}

.carousel-track{
display:flex;
height:100%;
transition:transform 1s cubic-bezier(0.16,1,0.3,1);
}

.carousel-track img{
min-width:100%;
object-fit:cover;
filter:brightness(0.85);
transition:filter 0.8s ease;
}

.card:hover .carousel-track img{
filter:brightness(1);
}

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:2rem;
cursor:pointer;
opacity:0;
z-index:30;
transition:var(--transition);
}

.prev-btn{left:20px;}
.next-btn{right:20px;}

.card:hover .nav-btn{
opacity:0.5;
}

.card-info{
text-align:center;
}

.card-info h3{
font-size:0.85rem;
font-weight:400;
text-transform:uppercase;
margin:0;
letter-spacing:3px;
}

.precio{
font-size:1.1rem;
font-weight:200;
margin:15px 0;
color:var(--text-secondary);
}

.specs{
font-size:0.6rem;
color:#555;
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:30px;
}

.btn-adquirir{
background:transparent;
color:var(--accent);
padding:20px;
border:1px solid rgba(255,255,255,0.1);
width:100%;
font-size:0.7rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:5px;
cursor:pointer;
transition:var(--transition);
border-radius:2px;
}

.btn-adquirir:hover:not(:disabled){
background:var(--accent);
color:var(--bg);
box-shadow:0 0 35px rgba(255,255,255,0.15);
}

.btn-adquirir:disabled{
opacity:0.1;
cursor:not-allowed;
}

/* BITACORA */

.bitacora-header{
padding:10rem 5% 5rem;
text-align:center;
}

.bitacora-grid{
display:grid;
grid-template-columns:1fr;
gap:150px;
max-width:1000px;
margin:0 auto;
padding:0 5% 10rem;
}

.bitacora-item{
cursor:pointer;
text-align:center;
animation:revealSlight 1.5s var(--transition) backwards;
}

.meta-bitacora{
font-size:0.55rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:5px;
color:var(--text-secondary);
margin-bottom:40px;
display:block;
}

.img-container{
width:100%;
height:600px;
overflow:hidden;
margin-bottom:50px;
filter:grayscale(100%);
transition:var(--transition);
border-radius:2px;
}

.bitacora-item:hover .img-container{
filter:grayscale(0%);
}

.bitacora-item img{
width:100%;
height:100%;
object-fit:cover;
transition:transform 2s ease;
}

.bitacora-item:hover img{
transform:scale(1.05);
}

.bitacora-item h3{
font-family:'Playfair Display',serif;
font-size:4rem;
margin:0 0 30px 0;
font-weight:400;
font-style:italic;
}

.bitacora-item p{
line-height:2;
color:var(--text-secondary);
font-size:1rem;
max-width:650px;
margin:0 auto;
overflow:hidden;
display:-webkit-box;
-webkit-line-clamp:3;
-webkit-box-orient:vertical;
}

/* FOOTER */

footer{
padding:10rem 5%;
text-align:center;
border-top:1px solid rgba(255,255,255,0.05);
font-size:0.6rem;
font-weight:700;
letter-spacing:10px;
color:#333;
text-transform:uppercase;
}

/* MOBILE */

@media (max-width:768px){

body{padding-top:70px;}

.site-header{padding:1rem 4%;}

.site-header h1{
font-size:0.9rem;
letter-spacing:3px;
}

.nav-menu ul{gap:1.5rem;}

.nav-menu a{
font-size:0.55rem;
letter-spacing:2px;
}

.hero{
padding:6rem 5% 3rem;
}

.hero h2{
font-size:clamp(2.5rem,18vw,5rem);
letter-spacing:-3px;
}

.hero p{
font-size:1rem;
margin-top:15px;
}

.filter-bar{
gap:2rem;
padding:0 5% 2rem;
justify-content:flex-start;
}

.filter-btn{
font-size:0.6rem;
letter-spacing:3px;
}

.main-container{
padding:0 5% 6rem;
}

.grid{
grid-template-columns:1fr;
gap:50px;
}

.nav-btn{
opacity:0.5;
font-size:1.5rem;
}

.img-container{
height:300px;
margin-bottom:30px;
}

.bitacora-item h3{
font-size:2rem;
margin-bottom:20px;
}

.bitacora-item p{
font-size:0.9rem;
line-height:1.7;
}

footer{
padding:6rem 5%;
letter-spacing:6px;
}

}

</style>
</head>
