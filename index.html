<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADLAMB. | Archive Supply</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;900&family=Playfair+Display:italic,wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0a; 
            --surface: #111111;
            --accent: #ffffff;
            --text-secondary: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            --oxido: #b35a38; 
        }

        /* --- Reset & Base --- */
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background-color: var(--bg); color: var(--accent);
            padding-top: 80px; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Preloader --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        #preloader h2 { font-weight: 900; letter-spacing: 15px; font-size: 1.5rem; text-transform: uppercase; color: #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- Header --- */
        .site-header { 
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(25px);
            padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid var(--border);
        }
        .site-header h1 { font-weight: 900; font-size: 1.5rem; letter-spacing: 3px; margin: 0; cursor: pointer; text-transform: uppercase; }
        .nav-menu ul { display: flex; gap: 3.5rem; list-style: none; margin: 0; padding: 0; }
        .nav-menu a { color: var(--accent); text-decoration: none; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; opacity: 0.4; transition: var(--transition); cursor: pointer; }
        .nav-menu a.active, .nav-menu a:hover { opacity: 1; color: var(--oxido); }

        .content-section { display: none; }
        .content-section.active { display: block; }

        /* --- Hero Banner --- */
        .hero-banner { 
            position: relative;
            height: 60vh; 
            width: 100%; 
            margin: 0px auto 5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('banner-vintage regal.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            border-radius: 4px;
        }
        .hero-banner h2 { 
            font-size: clamp(3.5rem, 12vw, 10rem); font-weight: 900; line-height: 0.8; margin: 0; 
            letter-spacing: -0.05em; text-transform: uppercase; color: #fff;
        }
        .hero-banner .frase-pregunta {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem; font-style: italic; color: #eee;
            margin: 25px 0 40px;
        }
        .btn-banner {
            background: #fff; color: #000; padding: 18px 45px; border-radius: 2px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            text-decoration: none; transition: var(--transition); font-size: 0.9rem;
        }

        /* --- Filtros --- */
        .filter-bar { padding: 0 5% 4rem; display: flex; justify-content: center; gap: 3rem; overflow-x: auto; scrollbar-width: none;}
        .filter-btn { background: none; border: none; color: var(--accent); font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; opacity: 0.3; transition: var(--transition); padding-bottom: 8px; border-bottom: 1px solid transparent; white-space: nowrap; }
        .filter-btn.active, .filter-btn:hover { opacity: 1; color: var(--oxido); border-bottom: 1px solid var(--oxido); }

        /* --- Grid de Productos --- */
        .main-container { max-width: 1600px; margin: 0 auto; padding: 0 5% 10rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 50px; }
        .card { position: relative; transition: var(--transition); }
        .carousel-container { position: relative; width: 100%; aspect-ratio: 1 / 1.3; overflow: hidden; margin-bottom: 25px; background: #0d0d0d; }
        .carousel-track { display: flex; height: 100%; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .carousel-track img { min-width: 100%; object-fit: cover; }
        
        .badge { position: absolute; top: 20px; left: 20px; z-index: 20; padding: 8px 15px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; background: #fff; color: #000; }
        .badge.agotado { background: #1a1a1a; color: #888; border: 1px solid rgba(255,255,255,0.1); }

        .card.agotado-visual .carousel-track img { 
            filter: grayscale(60%); 
            opacity: 0.7; 
        }
        .card.agotado-visual .card-info {
            opacity: 0.8;
        }

        .card-info h3 { font-size: 1.2rem; margin: 20px 0 8px; font-weight: 600; letter-spacing: 1px; }
        .card-info .precio { font-family: 'Playfair Display', serif; font-style: italic; color: var(--text-secondary); margin-bottom: 12px; font-size: 1.3rem; }
        .card-info .specs { font-size: 0.9rem; letter-spacing: 1px; opacity: 0.6; margin-bottom: 25px; }

        .btn-adquirir { background: transparent; color: #fff; padding: 18px; border: 1px solid var(--border); width: 100%; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; cursor: pointer; transition: var(--transition); }
        .btn-adquirir:hover:not(:disabled) { background: #fff; color: #000; border-color: #fff; }
        
        .btn-adquirir:disabled {
            border: 1px solid rgba(255,255,255,0.1);
            color: #666;
            cursor: not-allowed;
            background: rgba(255,255,255,0.02);
        }

        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 20px 15px; cursor: pointer; z-index: 30; opacity: 0; transition: 0.3s; font-size: 1.2rem; }
        .card:hover .nav-btn { opacity: 1; }
        .prev-btn { left: 0; }
        .next-btn { right: 0; }

        /* --- Bitácora Optimizada (Simétrica y Completa) --- */
        .bitacora-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 80px 40px; 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 5rem 5% 10rem; 
        }
        .bitacora-item { 
            cursor: pointer; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 40px; 
            transition: var(--transition);
        }
        .bitacora-item:hover { transform: translateY(-5px); }
        
        .bitacora-item .img-container { 
            width: 100%; 
            aspect-ratio: 4 / 3; 
            overflow: hidden; 
            margin-top: 25px; 
            margin-bottom: 30px; 
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bitacora-item .img-container img { 
            width: 100%; 
            height: 100%; 
            display: block; 
            object-fit: contain; /* Muestra la imagen completa sin recortes */
            transition: transform 0.8s ease;
        }
        .bitacora-item:hover .img-container img { transform: scale(1.02); }
        
        .bitacora-item h3 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.2rem; 
            margin: 20px 0; 
            font-weight: 400; 
            font-style: italic; 
            line-height: 1.2; 
        }
        .meta-bitacora { 
            font-size: 0.75rem; 
            letter-spacing: 2px; 
            color: var(--oxido); 
            text-transform: uppercase; 
            font-weight: 600; 
        }
        .bitacora-item p { 
            line-height: 1.6; 
            color: var(--text-secondary); 
            font-size: 1.1rem; 
            text-align: left; 
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Modales --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-content { width: 100%; max-width: 600px; text-align: center; }
        #modal-lectura .modal-content { max-width: 850px; text-align: left; background: #0a0a0a; padding: 60px; overflow-y: auto; max-height: 90vh; border: 1px solid var(--border); }
        #modal-lectura h3 { font-family: 'Playfair Display', serif; font-size: 3.5rem; font-style: italic; margin-bottom: 30px; line-height: 1; }
        #modal-lectura p { font-size: 1.4rem; line-height: 1.9; font-weight: 200; color: #ccc; text-align: justify; white-space: pre-line; }

        input { width: 100%; padding: 20px 0; border: none; border-bottom: 2px solid #333; background: transparent; font-size: 2.2rem; outline: none; text-align: center; color: #fff; margin-bottom: 45px; font-family: 'Playfair Display', serif; font-style: italic; }
        footer { padding: 8rem 5%; text-align: center; border-top: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; letter-spacing: 6px; color: #444; }

        @media (max-width: 1024px) {
            .bitacora-grid { grid-template-columns: 1fr; gap: 60px; max-width: 800px; }
        }
        @media (max-width: 768px) {
            .hero-banner { height: 55vh; }
            .hero-banner h2 { font-size: 18vw; }
            .bitacora-item h3 { font-size: 1.8rem; }
            .nav-menu ul { gap: 1.5rem; }
            .nav-menu a { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div id="preloader"><h2>MADLAMB.</h2></div>

<header class="site-header">
    <h1 onclick="showSection('suministros')">MADLAMB.</h1>
    <nav class="nav-menu">
        <ul>
            <li><a id="nav-suministros" class="active" onclick="showSection
