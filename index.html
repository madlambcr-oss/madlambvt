<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MADLAMB. | Archive Supply</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:italic,wght@700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#f4f4f4;
--negro:#000;
--gris:#888;
--gris-claro:#ddd;
--rojo-agotado:#a30000;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:var(--bg);
padding-top:60px;
}

.site-header{
position:fixed;
top:0;
width:100%;
background:white;
display:flex;
justify-content:space-between;
padding:15px 5%;
border-bottom:1px solid #ddd;
}

.nav-menu ul{
display:flex;
gap:20px;
list-style:none;
}

.content-section{
display:none;
}

.content-section.active{
display:block;
}

.hero{
padding:120px 5% 40px;
}

.hero h2{
font-size:5rem;
margin:0;
}

.hero-sub{
font-size:0.8rem;
letter-spacing:2px;
color:var(--gris);
}

.filter-bar{
padding:20px 5%;
display:flex;
gap:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
padding:40px 5%;
}

.card{
background:white;
padding:20px;
}

.card img{
width:100%;
height:400px;
object-fit:cover;
}

.card-info h3{
font-size:0.9rem;
}

.precio{
color:var(--gris);
}

.specs{
font-size:0.7rem;
color:var(--gris);
margin-bottom:15px;
}

.btn-adquirir{
background:black;
color:white;
border:none;
padding:12px;
width:100%;
cursor:pointer;
}

.bitacora-header{
padding:120px 5% 40px;
}

.bitacora-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
padding:0 5% 60px;
}

.bitacora-item img{
width:100%;
height:500px;
object-fit:cover;
}

footer{
text-align:center;
padding:60px;
border-top:1px solid #ddd;
font-size:0.7rem;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.95);
justify-content:center;
align-items:center;
}

.modal-content{
max-width:500px;
}

</style>

</head>

<body>

<header class="site-header">

<h1 onclick="showSection('suministros')">MADLAMB.</h1>

<nav class="nav-menu">

<ul>
<li><a id="nav-suministros" onclick="showSection('suministros')">Suministros</a></li>
<li><a id="nav-bitacora" onclick="showSection('bitacora')">Bitácora</a></li>
</ul>

</nav>

</header>


<section id="suministros" class="content-section active">

<div class="hero">

<h2>Archivo<br>Madlamb</h2>

<p><i>Historia & Legado</i></p>

<span class="hero-sub">
Curaduría de piezas vintage seleccionadas una a una.
</span>

</div>


<div class="filter-bar">

<button onclick="filtrar('todas')">Todas</button>
<button onclick="filtrar('chaquetas')">Chaquetas</button>
<button onclick="filtrar('hoodies')">Hoodies</button>
<button onclick="filtrar('camisetas')">Camisetas</button>

</div>


<div class="grid" id="galeria"></div>

</section>



<section id="bitacora" class="content-section">

<div class="bitacora-header">

<h2>EL LEGADO.</h2>

</div>

<div class="bitacora-grid" id="bitacora-grid"></div>

</section>



<footer>

<p>MADLAMB ARCHIVE SUPPLY</p>

<p>Curated Vintage Garments — San José, Costa Rica</p>

<p>Established 2026</p>

</footer>


<div id="modal" class="modal">

<div class="modal-content">

<form id="form-pedido">

<input id="nombre-cliente" placeholder="TU NOMBRE">

<button class="btn-adquirir">
CONTINUAR A WHATSAPP
</button>

</form>

</div>

</div>


<script src="data.js"></script>
<script src="main.js"></script>

</body>

</html>
